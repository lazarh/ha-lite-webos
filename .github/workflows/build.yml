name: Build webOS IPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package .ipk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify add-on app is in sync
        run: |
          chmod +x scripts/sync-addon.sh
          ./scripts/sync-addon.sh
          git diff --exit-code -- addon/webapp/index.html

      - name: Validate repository files
        run: |
          python3 -c 'import json; json.load(open("repository.json"))'
          grep -q '^slug: ha_lite$' addon/config.yaml

      - name: Build IPK (ar + tar, no SDK)
        run: |
          chmod +x package.sh
          LAUNCH_URL="http://your-ha-host:8123/local/halite/index.html" ./package.sh

      - name: Inspect IPK
        run: |
          set -euo pipefail
          ls -lh dist
          ar t dist/*.ipk

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.halite.dashboard-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            webapp/index.html
          body: |
            HA Lite — a fast, high-contrast Home Assistant dashboard for LG webOS 3.x TVs.

            Features
            - Remote-first setup: enter the Home Assistant token with the on-screen D-pad keyboard and pick tiles on the TV.
            - Switch, light and input_boolean tiles with instant D-pad toggling.
            - Sensor and binary-sensor tiles with device icons, formatted values and 24-hour sparkline charts.
            - Live updates over the Home Assistant WebSocket API, with automatic reconnect and REST polling fallback.
            - 10-foot UI: high-contrast tiles, large type, clear focus ring and safe-area margins; up to 12 tiles.
            - Connection feedback and clear token/error guidance.

            Install
            1. Copy `webapp/index.html` into Home Assistant's `config/www/halite/` folder.
            2. Build the TV launcher with your own Home Assistant URL:
               `LAUNCH_URL="http://your-ha-host:8123/local/halite/index.html?v=0.4.0" ./package.sh`
            3. Install the resulting IPK on the TV via Developer Mode (`ares-install`).

            The attached IPK is a template built with a placeholder host; rebuild it with your URL.
            See the README for the full installation guide.
